<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>문제 관리 · 세븐큐(7Q)</title><link rel="stylesheet" href="css/style.css"><script src="data/questions.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="admin">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">7Q<span></span></span><span>세븐큐<span class="brand-sub">문제 관리</span></span></a><a class="text-link" href="index.html">학습 화면으로 →</a></header>
  <main class="admin-main"><div class="page-heading"><span class="eyebrow">QUESTION BANK</span><h1>문제 관리</h1><p>자격증별 문제를 등록하고 수정하세요.</p></div><div class="notice">현재 탭에서만 유지되는 임시 데이터입니다. 같은 탭에서 학습 화면으로 이동하면 반영되며, 탭을 닫으면 초기화됩니다.</div>
    <div class="admin-grid"><section class="admin-panel"><h2 id="form-title">새 문제 등록</h2><form id="admin-form">
      <label class="form-label" for="admin-certificate">자격증</label><select id="admin-certificate" name="certificate"><option value="bigdata">빅데이터분석기사</option><option value="information">정보처리기사</option></select>
      <label class="form-label" for="question-text">문제</label><textarea id="question-text" name="question" rows="4" maxlength="2000" placeholder="문제 내용을 입력하세요." required></textarea>
      <label class="form-label" for="option-0">보기 1</label><input id="option-0" name="option0" maxlength="500" required>
      <label class="form-label" for="option-1">보기 2</label><input id="option-1" name="option1" maxlength="500" required>
      <label class="form-label" for="option-2">보기 3</label><input id="option-2" name="option2" maxlength="500" required>
      <label class="form-label" for="option-3">보기 4</label><input id="option-3" name="option3" maxlength="500" required>
      <label class="form-label" for="correct-answer">정답</label><select id="correct-answer" name="answer"><option value="0">보기 1</option><option value="1">보기 2</option><option value="2">보기 3</option><option value="3">보기 4</option></select>
      <label class="form-label" for="explanation">Mock 해설 <span class="muted">(선택)</span></label><textarea id="explanation" name="explanation" rows="3" maxlength="3000" placeholder="정답인 이유를 입력하세요. 비워 두면 정답 안내를 표시합니다."></textarea>
      <div class="form-actions"><button class="button primary" type="submit" id="save-question">문제 등록</button><button class="button secondary" type="button" id="cancel-edit" hidden>수정 취소</button></div>
    </form><p id="message" class="message" role="status"></p></section>
    <section class="admin-panel"><div class="section-heading"><h2>등록된 문제</h2><span id="bank-count" class="muted"></span></div><label class="form-label" for="list-certificate">목록 자격증</label><select id="list-certificate"><option value="bigdata">빅데이터분석기사</option><option value="information">정보처리기사</option></select><div id="question-list" class="admin-list"></div></section></div>
  </main><footer>세븐큐(7Q)<span>문제은행 · 첫 번째 버전</span></footer>
</body>
</html>
