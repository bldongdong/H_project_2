<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 세븐큐(7Q)</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="signup">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">7Q<span></span></span><span>세븐큐<span class="brand-sub">가볍게 풀고, 확실하게 배우기</span></span></a><a class="text-link" href="index.html">학습 화면으로 →</a></header>
  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="page-heading"><span class="eyebrow">작은 공부를 함께 시작해요</span><h1 id="auth-title">회원가입</h1><p>이메일과 비밀번호로 계정을 만들어 보세요.</p></div>
      <form id="auth-form" data-mode="signup" aria-busy="true">
        <label class="form-label" for="auth-email">이메일</label>
        <input id="auth-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="name@example.com" required>
        <label class="form-label" for="auth-password">비밀번호</label>
        <input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="password-help" required>
        <p id="password-help" class="field-help">비밀번호는 6자 이상 입력해 주세요.</p>
        <button id="auth-submit" class="button primary" type="submit" disabled>로그인 상태 확인 중…</button>
      </form>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite" aria-atomic="true"></p>
      <p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
      <a class="auth-guest" href="index.html">로그인 없이 문제 풀기 →</a>
      <noscript><p class="auth-message">회원가입하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
    </section>
  </main>
  <footer>세븐큐(7Q)<span>오늘의 일곱 문제가 내일의 실력이 되도록.</span></footer>
</body>
</html>
